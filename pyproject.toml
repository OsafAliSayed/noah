[project]
name = "noah"
version = "0.1.0"
description = "A voice layer over your operating system."
readme = "README.md"
authors = [
    { name = "OsafAliSayed", email = "aousafalisayedb2@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "faster-whisper>=1.2.1",
    "numpy>=2.5.4",
    "openai>=3.31.0",
    "openwakeword>=0.4.0",
    "piper-tts>=1.8.0",
    "psutil>=7.2.2",
    "pydantic>=2.14.1",
    "pynput>=1.8.2",
    "python-dotenv>=1.2.4",
    "sounddevice>=0.5.6",
    "typer>=0.27.3",
]

[project.optional-dependencies]
# CUDA 12 libraries for faster-whisper on the NVIDIA GPU: `uv sync --extra gpu`.
gpu = ["nvidia-cublas-cu12>=12.4", "nvidia-cudnn-cu12>=9,<10"]

[project.scripts]
noah = "noah.cli:app"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff.lint.per-file-ignores]
# The benchmark's case table reads best one case per line.
"scripts/eval_models.py" = ["E501"]
