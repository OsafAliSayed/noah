[project]
name = "noah"
version = "0.1.0"
description = "A voice layer over your operating system."
readme = "README.md"
authors = [
    { name = "OsafAliSayed", email = "aousafalisayedb2@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "psutil>=7.2.2",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "typer>=0.27.3",
]

[project.scripts]
noah = "noah.cli:app"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
